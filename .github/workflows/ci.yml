name: Test and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build API image
        run: docker build -f Dockerfile.api -t spaceship-titanic-api .

      - name: Build Streamlit image
        run: docker build -f Dockerfile.streamlit -t spaceship-titanic-ui .